<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Gradient -->
  <defs>
    <linearGradient id="bg-gradient" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="25%" stop-color="#1E293B"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="75%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    
    <!-- Emerald Gradient -->
    <linearGradient id="emerald-gradient" x1="0" y1="0" x2="1" y2="1" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    
    <!-- Blue Gradient -->
    <linearGradient id="blue-gradient" x1="0" y1="0" x2="1" y2="1" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    
    <!-- Title Gradient -->
    <linearGradient id="title-gradient" x1="0" y1="0" x2="1" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#A7F3D0"/>
      <stop offset="70%" stop-color="#BFDBFE"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-gradient)"/>
  
  <!-- Decorative Blurs -->
  <circle cx="150" cy="100" r="120" fill="#10B981" opacity="0.15" filter="blur(80px)"/>
  <circle cx="1050" cy="150" r="100" fill="#3B82F6" opacity="0.12" filter="blur(60px)"/>
  <circle cx="950" cy="500" r="150" fill="#EC4899" opacity="0.1" filter="blur(100px)"/>
  <circle cx="250" cy="450" r="80" fill="#06B6D4" opacity="0.1" filter="blur(50px)"/>
  
  <!-- Main Container -->
  <rect x="100" y="80" width="1000" height="470" rx="24" fill="#1E293B" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
  
  <!-- Header Section -->
  <rect x="120" y="100" width="960" height="120" rx="16" fill="#0F172A" fill-opacity="0.6"/>
  
  <!-- Graduation Cap Icon -->
  <g transform="translate(140, 120)">
    <rect x="8" y="20" width="64" height="40" rx="4" fill="url(#emerald-gradient)"/>
    <rect x="0" y="24" width="80" height="8" rx="4" fill="url(#emerald-gradient)"/>
    <circle cx="72" cy="28" r="3" fill="#10B981"/>
    <rect x="72" y="32" width="2" height="16" fill="#10B981"/>
  </g>
  
  <!-- Main Title -->
  <text x="250" y="150" font-family="Arial, sans-serif" font-size="40" font-weight="bold" fill="url(#title-gradient)">AI-Powered CGPA Calculator</text>
  
  <!-- Subtitle -->
  <text x="250" y="185" font-family="Arial, sans-serif" font-size="18" fill="#94A3B8">Upload your grade sheet and let advanced AI extract courses automatically</text>
  
  <!-- Upload Section -->
  <rect x="140" y="250" width="300" height="160" rx="12" fill="#0F172A" stroke="#374151" stroke-width="2" stroke-dasharray="8,8"/>
  
  <!-- Upload Icon -->
  <g transform="translate(270, 310)">
    <rect x="0" y="12" width="40" height="28" rx="4" fill="none" stroke="url(#emerald-gradient)" stroke-width="2"/>
    <path d="M8 20 L20 8 L32 20" fill="none" stroke="url(#emerald-gradient)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M20 8 L20 32" fill="none" stroke="url(#emerald-gradient)" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <text x="290" y="365" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">Upload Grade Sheet</text>
  <text x="290" y="385" font-family="Arial, sans-serif" font-size="12" fill="#9CA3AF" text-anchor="middle">PDF, PNG, JPG</text>
  
  <!-- Course Cards Section -->
  <g transform="translate(480, 250)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="180" height="120" rx="8" fill="#1E293B" stroke="#374151"/>
    <rect x="8" y="8" width="32" height="16" rx="4" fill="#10B981" fill-opacity="0.2"/>
    <text x="24" y="18" font-family="Arial, sans-serif" font-size="10" font-weight="600" fill="#10B981" text-anchor="middle">A+</text>
    <text x="12" y="40" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#E2E8F0">CS101</text>
    <text x="12" y="58" font-family="Arial, sans-serif" font-size="10" fill="#94A3B8">Programming</text>
    <text x="12" y="78" font-family="Arial, sans-serif" font-size="9" fill="#6B7280">Credits: 3</text>
    <text x="12" y="94" font-family="Arial, sans-serif" font-size="9" fill="#6B7280">Grade: A+</text>
    <text x="168" y="110" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#10B981" text-anchor="end">12.0</text>
    
    <!-- Card 2 -->
    <rect x="200" y="0" width="180" height="120" rx="8" fill="#1E293B" stroke="#374151"/>
    <rect x="208" y="8" width="28" height="16" rx="4" fill="#3B82F6" fill-opacity="0.2"/>
    <text x="222" y="18" font-family="Arial, sans-serif" font-size="10" font-weight="600" fill="#3B82F6" text-anchor="middle">A-</text>
    <text x="212" y="40" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#E2E8F0">MATH201</text>
    <text x="212" y="58" font-family="Arial, sans-serif" font-size="10" fill="#94A3B8">Calculus</text>
    <text x="212" y="78" font-family="Arial, sans-serif" font-size="9" fill="#6B7280">Credits: 4</text>
    <text x="212" y="94" font-family="Arial, sans-serif" font-size="9" fill="#6B7280">Grade: A-</text>
    <text x="368" y="110" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#3B82F6" text-anchor="end">14.8</text>
    
    <!-- Card 3 -->
    <rect x="400" y="0" width="180" height="120" rx="8" fill="#1E293B" stroke="#374151"/>
    <rect x="408" y="8" width="28" height="16" rx="4" fill="#EAB308" fill-opacity="0.2"/>
    <text x="422" y="18" font-family="Arial, sans-serif" font-size="10" font-weight="600" fill="#EAB308" text-anchor="middle">B+</text>
    <text x="412" y="40" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#E2E8F0">PHY301</text>
    <text x="412" y="58" font-family="Arial, sans-serif" font-size="10" fill="#94A3B8">Physics</text>
    <text x="412" y="78" font-family="Arial, sans-serif" font-size="9" fill="#6B7280">Credits: 3</text>
    <text x="412" y="94" font-family="Arial, sans-serif" font-size="9" fill="#6B7280">Grade: B+</text>
    <text x="568" y="110" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#EAB308" text-anchor="end">9.9</text>
  </g>
  
  <!-- CGPA Display -->
  <rect x="720" y="390" width="240" height="80" rx="12" fill="url(#emerald-gradient)" fill-opacity="0.1" stroke="url(#emerald-gradient)" stroke-width="1"/>
  <text x="840" y="415" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#94A3B8" text-anchor="middle">Your CGPA</text>
  <text x="840" y="450" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="url(#emerald-gradient)" text-anchor="middle">3.825</text>
  
  <!-- Features Text -->
  <text x="140" y="450" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#E2E8F0">✨ AI Course Extraction</text>
  <text x="140" y="475" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#E2E8F0">📊 Real-time Calculations</text>
  <text x="140" y="500" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#E2E8F0">📄 PDF Export</text>
  
  <text x="340" y="450" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#E2E8F0">🔍 Course Search</text>
  <text x="340" y="475" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#E2E8F0">📱 Mobile Responsive</text>
  <text x="340" y="500" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#E2E8F0">⚡ Fast Processing</text>
  
  <!-- Brand -->
  <text x="1060" y="590" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#10B981" text-anchor="end">WithShawon.vercel.app</text>
</svg>
