<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta name="author" content="Asif Bhuiyan Shawon">
  <meta name="robots" content="index, follow">

  <!-- Open Graph -->
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ site.url }}{{ page.url }}">
  <meta property="og:image" content="https://avatars.githubusercontent.com/u/90594450?v=4">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="{{ page.title | default: site.title }}">
  <meta name="twitter:description" content="{{ page.description | default: site.description }}">

  <!-- Canonical -->
  <link rel="canonical" href="{{ site.url }}{{ page.url }}">

  <!-- Google Fonts: Inter (body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Site stylesheet -->
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

  <!-- Inline SVG favicon — letter A -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='8' fill='%230f0f0f'/><text x='50' y='72' font-size='62' font-family='system-ui,sans-serif' font-weight='700' fill='white' text-anchor='middle'>A</text></svg>">
</head>
<body>

<!-- ===== NAVIGATION ===== -->
<header class="site-header" role="banner">
  <div class="container">
    <a class="nav-brand" href="{{ '/' | relative_url }}" aria-label="Asif Bhuiyan Shawon — Home">
      ASIF SHAWON
    </a>
    <nav class="site-nav" aria-label="Main navigation">
      <ul class="nav-links" role="list">
        <li><a href="#about">About</a></li>
        <li><a href="#work">Work</a></li>
        <li><a href="#projects">Projects</a></li>
        <li><a href="#experience">Experience</a></li>
        <li><a href="#skills">Skills</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </nav>
  </div>
</header>

<!-- ===== MAIN CONTENT ===== -->
<main id="main-content" role="main">
  {{ content }}
</main>

<!-- ===== FOOTER ===== -->
<footer class="site-footer" role="contentinfo">
  <div class="container footer-inner">
    <span class="footer-copy">© 2026 Asif Bhuiyan Shawon &middot; Dhaka, Bangladesh</span>
    <a class="footer-portfolio" href="https://withshawon.vercel.app/" target="_blank" rel="noreferrer noopener">
      Full portfolio ↗
    </a>
  </div>
</footer>

</body>
</html>
